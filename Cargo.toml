[package]
name = "yui-kr"
version = "0.3.0"
authors = ["Taketo Sano <taketo1024@gmail.com>"]
description = "YUI-KR"
license = "MIT"
edition = "2024"
rust-version = "1.89"   # floor set by yui-matrix / nalgebra 0.35

[[bin]]
name = "ykr"
path = "src/bin/main.rs"

[lib]
path = "src/lib/lib.rs"

[features]
default = ["multithread"]
multithread = ["rayon"]
batch_test = []

[profile.release]
debug = true
overflow-checks = true

[dependencies]
num-bigint = "0.5.1"
num-traits = "0.2.19"
itertools = "0.15.0"
indexmap = { version = "2.14.0", features = ["serde"] }
petgraph = "0.8.3"
derive_more = { version = "2.1.1", features = ["display", "debug"] }
cartesian = "0.3.0"
delegate = "0.13.5"
num-integer = "0.1.46"
rayon = { version = "1.12.0", optional = true }
log = "0.4.29"
maplit = "1.0.2"
simplelog = "0.12.2"
clap = { version = "4.6.1", features = ["derive", "cargo"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
regex = "1.12.3"
cfg-if = "1.0.4"
# `path` is used for local builds, `version` when published.
yui-core =     { version = "0.5.0", path = "../yui/lib-core" }
yui-link =     { version = "0.5.0", path = "../yui/lib-link" }
yui-matrix =   { version = "0.5.0", path = "../yui/lib-matrix" }
yui-homology = { version = "0.5.0", path = "../yui/lib-homology" }

[dev-dependencies]
yui-link = { version = "0.5.0", path = "../yui/lib-link", features = ["test-utils"] }
